<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyCab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="60%" stop-color="#0f1722"/>
      <stop offset="100%" stop-color="#1f1118"/>
    </linearGradient>
    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e65100" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d0ebff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#4dabf7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1864ab" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Céu Noturno & Lua Fria -->
  <rect width="800" height="450" fill="url(#skyCab)"/>
  <circle cx="200" cy="110" r="100" fill="url(#moonGlowCyan)"/>
  <circle cx="200" cy="110" r="42" fill="#e7f5ff"/>
  <circle cx="210" cy="102" r="38" fill="#d0ebff" opacity="0.6"/>

  <!-- Colinas e Floresta Sombria de Pinheiros Mortos -->
  <path d="M0,260 Q180,240 380,265 T800,250 L800,450 L0,450 Z" fill="#090c12"/>
  <path d="M0,290 Q240,280 500,295 T800,285 L800,450 L0,450 Z" fill="#05070a"/>

  <!-- Silhuetas de Pinheiros Pontiagudos -->
  <g fill="#040608">
    <polygon points="80,280 95,210 110,280"/>
    <polygon points="120,285 132,225 145,285"/>
    <polygon points="150,290 165,215 180,290"/>
    <polygon points="620,280 635,200 650,280"/>
    <polygon points="660,285 675,215 690,285"/>
    <polygon points="710,280 725,230 740,280"/>
  </g>

  <!-- Terreno Próximo -->
  <path d="M0,320 Q300,305 600,325 T800,315 L800,450 L0,450 Z" fill="#030406"/>

  <!-- A Cabana Velha (Centro / Direita) -->
  <g>
    <!-- Paredes da Cabana (Madeira Envelhecida) -->
    <polygon points="360,250 540,240 560,360 350,370" fill="#140e11" stroke="#261a20" stroke-width="3"/>
    
    <!-- Linhas das Tábuas de Madeira da Parede -->
    <line x1="358" y1="275" x2="545" y2="265" stroke="#0a0708" stroke-width="2"/>
    <line x1="355" y1="300" x2="550" y2="290" stroke="#0a0708" stroke-width="2"/>
    <line x1="352" y1="325" x2="555" y2="315" stroke="#0a0708" stroke-width="2"/>
    <line x1="350" y1="350" x2="558" y2="340" stroke="#0a0708" stroke-width="2"/>

    <!-- Telhado Quebrado com Tábuas Levantadas -->
    <polygon points="330,255 450,170 570,245 450,170 330,255" fill="#1e1317" stroke="#36222b" stroke-width="3"/>
    <!-- Chaminé Velha de Pedra -->
    <rect x="370" y="155" width="22" height="45" fill="#120c0e" stroke="#2b1c22" stroke-width="2"/>
    <!-- Fumaça Rala da Lareira Oculta -->
    <path d="M380,150 Q370,120 395,95 T380,60" stroke="rgba(255,255,255,0.2)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Porta da Cabana Entreaberta com Tocha -->
    <polygon points="430,290 480,286 482,365 428,367" fill="#050304" stroke="#3d212a" stroke-width="2"/>
    
    <!-- Janela Quebrada com Fresta de Luz Quente Sinistra -->
    <polygon points="375,285 410,282 412,320 377,322" fill="#ff922b" opacity="0.6"/>
    <line x1="393" y1="283" x2="395" y2="321" stroke="#140e11" stroke-width="2"/>
    <line x1="376" y1="302" x2="411" y2="301" stroke="#140e11" stroke-width="2"/>

    <!-- Suporte de Ferro & Tocha na Parede -->
    <circle cx="495" cy="305" r="45" fill="url(#torchGlow)"/>
    <line x1="488" y1="315" x2="496" y2="305" stroke="#261a20" stroke-width="3"/>
    <polygon points="492,305 498,305 496,290" fill="#ff6b6b"/>
    <polygon points="493,303 497,303 495,293" fill="#ffe066"/>
  </g>

  <!-- Entrada Reforçada da Catacumba (Subsolo do Refúgio) -->
  <ellipse cx="270" cy="390" rx="45" ry="14" fill="#020102" stroke="#4a181e" stroke-width="3"/>
  <path d="M240,388 L300,388 M250,382 L290,382 M250,394 L290,394" stroke="#c92a2a" stroke-width="2" opacity="0.8"/>

  <!-- Placa de Aviso no Chão: "REFÚGIO NÍVEL 2" -->
  <polygon points="200,355 235,350 237,375 198,378" fill="#1b1216" stroke="#332028" stroke-width="1.5"/>
  <line x1="218" y1="375" x2="218" y2="400" stroke="#0f090c" stroke-width="3"/>

  <!-- Moldura Gótica -->
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="rgba(212, 214, 226, 0.15)" stroke-width="2"/>
</svg>
