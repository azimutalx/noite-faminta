<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="amuletSlotBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241018"/>
      <stop offset="60%" stop-color="#12080c"/>
      <stop offset="100%" stop-color="#050304"/>
    </radialGradient>

    <!-- Brilho Escarlate da Gema Vampírica -->
    <radialGradient id="rubyAura" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ff2a55" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#c92a2a" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#5a0815" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Prata Oxidada e Gótica da Moldura -->
    <linearGradient id="antiqueSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9ecef"/>
      <stop offset="40%" stop-color="#adb5bd"/>
      <stop offset="80%" stop-color="#495057"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>

    <!-- Rubi Multifacetado Sangrento -->
    <linearGradient id="rubyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="30%" stop-color="#e03131"/>
      <stop offset="70%" stop-color="#9b111e"/>
      <stop offset="100%" stop-color="#49080e"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="300" height="300" rx="16" fill="url(#amuletSlotBg)" stroke="#4d2230" stroke-width="2"/>
  <rect x="6" y="6" width="288" height="288" rx="12" fill="none" stroke="#ff385c" stroke-width="1" opacity="0.3"/>

  <!-- Brilho Escarlate Central -->
  <circle cx="150" cy="165" r="105" fill="url(#rubyAura)"/>

  <!-- Corrente de Prata em V -->
  <!-- Elo Esquerdo -->
  <path d="M 50 15 Q 100 80 140 120" stroke="url(#antiqueSilver)" stroke-width="4.5" stroke-dasharray="7,4" fill="none"/>
  <!-- Elo Direito -->
  <path d="M 250 15 Q 200 80 160 120" stroke="url(#antiqueSilver)" stroke-width="4.5" stroke-dasharray="7,4" fill="none"/>

  <!-- Argola de Suspensão de Prata -->
  <circle cx="150" cy="120" r="14" fill="none" stroke="url(#antiqueSilver)" stroke-width="4"/>
  <circle cx="150" cy="120" r="8" fill="#12080c"/>

  <!-- Moldura Gótica Externa (Estilo Asa de Morcego / Flores-de-Lis) -->
  <path d="M 150 125 C 190 125 220 155 220 195 C 220 235 150 275 150 275 C 150 275 80 235 80 195 C 80 155 110 125 150 125 Z" fill="url(#antiqueSilver)" stroke="#212529" stroke-width="3"/>

  <!-- Detalhes de Entalhe e Pontas de Garra da Moldura -->
  <path d="M 150 135 C 182 135 208 160 208 195 C 208 228 150 262 150 262 C 150 262 92 228 92 195 C 92 160 118 135 150 135 Z" fill="#1b1d22" stroke="#495057" stroke-width="1.5"/>

  <!-- O Grande Rubi Lapidado (Facetado em Corte Coração / Gota Carmesim) -->
  <path d="M 150 145 C 175 145 195 168 195 195 C 195 220 150 250 150 250 C 150 250 105 220 105 195 C 105 168 125 145 150 145 Z" fill="url(#rubyFacet)" stroke="#ffe3e3" stroke-width="1"/>

  <!-- Facetas Internas do Rubi para Profundidade Realista -->
  <!-- Triângulo Superior Central -->
  <polygon points="150,150 170,175 130,175" fill="#ff8787" opacity="0.6"/>
  <!-- Faceta Esquerda -->
  <polygon points="150,150 130,175 110,195 125,210 150,238" fill="#c92a2a" opacity="0.5"/>
  <!-- Faceta Direita (Sombra) -->
  <polygon points="150,150 170,175 190,195 175,210 150,238" fill="#5c0813" opacity="0.7"/>
  <!-- Faceta Central Brilhante -->
  <polygon points="130,175 170,175 150,215" fill="#ff4d6d" opacity="0.8"/>
  <!-- Ponto de Brilho Especular Diamantino -->
  <ellipse cx="138" cy="165" rx="5" ry="3" transform="rotate(-30, 138, 165)" fill="#ffffff" opacity="0.85"/>

  <!-- Tag de Raridade e Efeito -->
  <rect x="12" y="12" width="85" height="22" rx="4" fill="rgba(201, 42, 42, 0.25)" stroke="#ff6b81" stroke-width="1"/>
  <text x="54" y="27" fill="#ff8787" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">RELÍQUIA</text>
  <text x="288" y="285" fill="#ced4da" font-size="10" font-family="monospace" text-anchor="end">+28 PODER OCULTO</text>
</svg>
