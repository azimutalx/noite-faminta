<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040508"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#181e2b"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4d6e2" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8492a6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d111a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stoneWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="25%" stop-color="#242b38"/>
      <stop offset="50%" stop-color="#1b202c"/>
      <stop offset="75%" stop-color="#2a3344"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>

    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#1c212c"/>
    </linearGradient>

    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c7cfa" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#3b5bdb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#181e2b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Céu Noturno -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Lua Pálida & Névoa Superior -->
  <circle cx="680" cy="90" r="55" fill="url(#moonGlow)"/>
  <circle cx="680" cy="90" r="32" fill="#e9ecef" opacity="0.85"/>
  <path d="M 640 100 Q 690 80 730 110" stroke="#ced4da" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Montanhas / Silhuetas Distantes -->
  <path d="M 0 320 L 120 270 L 260 310 L 450 250 L 620 300 L 800 260 L 800 450 L 0 450 Z" fill="#090b10"/>

  <!-- Solo de Pedra & Cascalho -->
  <rect x="0" y="360" width="800" height="90" fill="#0c0e14"/>
  <path d="M 0 360 Q 200 350 400 365 T 800 355 L 800 450 L 0 450 Z" fill="#11151e"/>

  <!-- Muralha e Casarão de Pedra (Cripta Ancestral) -->
  <!-- Base e Fachada Principal -->
  <rect x="220" y="190" width="360" height="175" fill="url(#stoneWall)" stroke="#2b3345" stroke-width="2"/>

  <!-- Linhas de Cantaria / Blocos de Pedra -->
  <line x1="220" y1="225" x2="580" y2="225" stroke="#10131a" stroke-width="2"/>
  <line x1="220" y1="260" x2="580" y2="260" stroke="#10131a" stroke-width="2"/>
  <line x1="220" y1="295" x2="580" y2="295" stroke="#10131a" stroke-width="2"/>
  <line x1="220" y1="330" x2="580" y2="330" stroke="#10131a" stroke-width="2"/>
  <line x1="310" y1="190" x2="310" y2="225" stroke="#10131a" stroke-width="2"/>
  <line x1="400" y1="225" x2="400" y2="260" stroke="#10131a" stroke-width="2"/>
  <line x1="490" y1="190" x2="490" y2="225" stroke="#10131a" stroke-width="2"/>
  <line x1="340" y1="260" x2="340" y2="295" stroke="#10131a" stroke-width="2"/>
  <line x1="460" y1="260" x2="460" y2="295" stroke="#10131a" stroke-width="2"/>
  <line x1="290" y1="295" x2="290" y2="330" stroke="#10131a" stroke-width="2"/>
  <line x1="510" y1="295" x2="510" y2="330" stroke="#10131a" stroke-width="2"/>

  <!-- Frontão Triangular / Telhado de Ardósia Maciça -->
  <polygon points="200,190 400,90 600,190" fill="url(#roofGrad)" stroke="#343d52" stroke-width="2"/>
  <!-- Friso e Cornija de Pedra -->
  <polygon points="215,190 400,98 585,190" fill="none" stroke="#4b5563" stroke-width="2"/>

  <!-- Rosácea / Óculo de Pedra Esculpida -->
  <circle cx="400" cy="150" r="22" fill="#08090d" stroke="#5c677d" stroke-width="3"/>
  <circle cx="400" cy="150" r="14" fill="#040507" stroke="#4263eb" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="128" x2="400" y2="172" stroke="#5c677d" stroke-width="2"/>
  <line x1="378" y1="150" x2="422" y2="150" stroke="#5c677d" stroke-width="2"/>

  <!-- Portal Ogival da Cripta (Entrada Arcada de Pedra) -->
  <path d="M 345 365 L 345 275 Q 400 220 455 275 L 455 365 Z" fill="#07080b" stroke="#3b4458" stroke-width="3"/>
  <!-- Portão de Ferro Forjado com Pontas de Lança -->
  <path d="M 355 365 L 355 285 Q 400 240 445 285 L 445 365 Z" fill="none" stroke="#232731" stroke-width="2"/>
  <line x1="370" y1="270" x2="370" y2="365" stroke="#495057" stroke-width="2"/>
  <line x1="385" y1="255" x2="385" y2="365" stroke="#495057" stroke-width="2"/>
  <line x1="400" y1="245" x2="400" y2="365" stroke="#495057" stroke-width="2.5"/>
  <line x1="415" y1="255" x2="415" y2="365" stroke="#495057" stroke-width="2"/>
  <line x1="430" y1="270" x2="430" y2="365" stroke="#495057" stroke-width="2"/>
  <line x1="345" y1="315" x2="455" y2="315" stroke="#343a40" stroke-width="3"/>

  <!-- Pilares Laterais e Tochas Espectrais Alquímicas -->
  <!-- Pilar Esquerdo -->
  <rect x="320" y="270" width="16" height="95" fill="#1b202c" stroke="#343d52" stroke-width="1.5"/>
  <circle cx="328" cy="265" r="28" fill="url(#torchGlow)"/>
  <polygon points="325,268 331,268 328,255" fill="#74c0fc"/>

  <!-- Pilar Direito -->
  <rect x="464" y="270" width="16" height="95" fill="#1b202c" stroke="#343d52" stroke-width="1.5"/>
  <circle cx="472" cy="265" r="28" fill="url(#torchGlow)"/>
  <polygon points="469,268 475,268 472,255" fill="#74c0fc"/>

  <!-- Frestas de Vigília / Balestreiros nos Lados -->
  <rect x="255" y="240" width="12" height="45" rx="6" fill="#050608" stroke="#343d52" stroke-width="1.5"/>
  <rect x="533" y="240" width="12" height="45" rx="6" fill="#050608" stroke="#343d52" stroke-width="1.5"/>

  <!-- Muretas e Lápides Góticas na Frente -->
  <!-- Lápide Esquerda -->
  <path d="M 140 375 L 140 325 Q 155 310 170 325 L 170 375 Z" fill="#151922" stroke="#2c3444" stroke-width="2"/>
  <line x1="155" y1="328" x2="155" y2="348" stroke="#3a4458" stroke-width="2"/>
  <line x1="148" y1="336" x2="162" y2="336" stroke="#3a4458" stroke-width="2"/>

  <!-- Lápide Direita -->
  <path d="M 630 380 L 630 335 Q 642 320 655 335 L 655 380 Z" fill="#151922" stroke="#2c3444" stroke-width="2"/>

  <!-- Mureta com Gárgulas nos Cantos -->
  <rect x="185" y="320" width="35" height="45" fill="#1b202c" stroke="#343d52" stroke-width="1.5"/>
  <!-- Silhueta da Gárgula Esquerda -->
  <polygon points="190,320 195,305 205,310 215,302 210,320" fill="#0f1218" stroke="#343d52" stroke-width="1"/>

  <rect x="580" y="320" width="35" height="45" fill="#1b202c" stroke="#343d52" stroke-width="1.5"/>
  <!-- Silhueta da Gárgula Direita -->
  <polygon points="585,320 590,302 600,310 610,305 615,320" fill="#0f1218" stroke="#343d52" stroke-width="1"/>

  <!-- Névoa Rastejante Inferior -->
  <path d="M 0 410 Q 150 395 300 415 T 600 405 T 800 420 L 800 450 L 0 450 Z" fill="#151c27" opacity="0.65"/>
  <path d="M 0 425 Q 220 415 440 430 T 800 420 L 800 450 L 0 450 Z" fill="#0b0e14" opacity="0.8"/>
</svg>
