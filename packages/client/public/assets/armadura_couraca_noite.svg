<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="armorSlotBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#191624"/>
      <stop offset="60%" stop-color="#0e0c16"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <radialGradient id="purpleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#da77f2" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7048e8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#495057"/>
      <stop offset="30%" stop-color="#212529"/>
      <stop offset="70%" stop-color="#343a40"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>

    <linearGradient id="highlightSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#868e96"/>
      <stop offset="50%" stop-color="#495057"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>

    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997300"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Card -->
  <rect width="300" height="300" rx="16" fill="url(#armorSlotBg)" stroke="#3b324d" stroke-width="2"/>
  <rect x="6" y="6" width="288" height="288" rx="12" fill="none" stroke="#da77f2" stroke-width="1" opacity="0.3"/>

  <!-- Brilho Arcano Roxo -->
  <circle cx="150" cy="150" r="115" fill="url(#purpleAura)"/>

  <!-- Gola e Cota de Malha Interior -->
  <path d="M 120 55 Q 150 75 180 55 L 195 90 Q 150 110 105 90 Z" fill="#121316" stroke="#212529" stroke-width="2"/>
  <!-- Textura da Cota de Malha -->
  <path d="M 125 70 Q 150 85 175 70 M 120 80 Q 150 95 180 80 M 115 90 Q 150 105 185 90" stroke="#343a40" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Ombreiras de Placas Pontiagudas (Pauldrons) -->
  <!-- Ombreira Esquerda -->
  <path d="M 105 75 L 45 95 L 40 135 L 75 155 L 95 125 Z" fill="url(#darkSteel)" stroke="#495057" stroke-width="1.5"/>
  <path d="M 50 100 L 95 82 L 88 120 L 48 130 Z" fill="url(#highlightSteel)" opacity="0.6"/>
  <circle cx="65" cy="115" r="3" fill="url(#goldFiligree)"/>
  <circle cx="55" cy="130" r="3" fill="url(#goldFiligree)"/>

  <!-- Ombreira Direita -->
  <path d="M 195 75 L 255 95 L 260 135 L 225 155 L 205 125 Z" fill="url(#darkSteel)" stroke="#495057" stroke-width="1.5"/>
  <path d="M 250 100 L 205 82 L 212 120 L 252 130 Z" fill="url(#highlightSteel)" opacity="0.6"/>
  <circle cx="235" cy="115" r="3" fill="url(#goldFiligree)"/>
  <circle cx="245" cy="130" r="3" fill="url(#goldFiligree)"/>

  <!-- Placa Peitoral Superior (Gorget & Pectoral) -->
  <path d="M 100 85 Q 150 110 200 85 L 205 160 Q 150 190 95 160 Z" fill="url(#darkSteel)" stroke="#5c6370" stroke-width="2"/>
  <path d="M 108 95 Q 150 118 192 95 L 198 155 Q 150 182 102 155 Z" fill="none" stroke="url(#goldFiligree)" stroke-width="1.5"/>

  <!-- Brasão Heráldico Central (Cálice Carmesim & Cruz Gótica) -->
  <polygon points="150,115 156,128 150,142 144,128" fill="#e03131" stroke="#ffd43b" stroke-width="1"/>
  <line x1="150" y1="105" x2="150" y2="150" stroke="#ffd43b" stroke-width="1.5"/>
  <line x1="140" y1="122" x2="160" y2="122" stroke="#ffd43b" stroke-width="1.5"/>

  <!-- Placas Abdominais Segmentadas (Fauld) -->
  <!-- Faixa 1 -->
  <path d="M 105 165 Q 150 188 195 165 L 190 195 Q 150 215 110 195 Z" fill="url(#darkSteel)" stroke="#343a40" stroke-width="1.5"/>
  <circle cx="150" cy="188" r="2.5" fill="url(#goldFiligree)"/>

  <!-- Faixa 2 -->
  <path d="M 112 200 Q 150 220 188 200 L 182 230 Q 150 248 118 230 Z" fill="url(#darkSteel)" stroke="#343a40" stroke-width="1.5"/>
  <circle cx="150" cy="222" r="2.5" fill="url(#goldFiligree)"/>

  <!-- Saia de Malha & Placas Finais (Tassets) -->
  <path d="M 115 235 L 135 268 L 165 268 L 185 235 Z" fill="#141517" stroke="#495057" stroke-width="1.5"/>
  <line x1="150" y1="235" x2="150" y2="265" stroke="url(#goldFiligree)" stroke-width="1.2"/>

  <!-- Tag de Raridade e Efeito -->
  <rect x="12" y="12" width="60" height="22" rx="4" fill="rgba(218, 119, 242, 0.25)" stroke="#da77f2" stroke-width="1"/>
  <text x="42" y="27" fill="#da77f2" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">ÉPICO</text>
  <text x="288" y="285" fill="#ced4da" font-size="10" font-family="monospace" text-anchor="end">+45 REDUÇÃO DE DANO</text>
</svg>
