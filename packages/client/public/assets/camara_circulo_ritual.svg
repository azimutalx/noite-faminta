<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="occultBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08030a"/>
      <stop offset="50%" stop-color="#12071a"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>
    <radialGradient id="arcaneRuneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#da77f2" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#9c27b0" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#4a148c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="magicRune" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3d9fa"/>
      <stop offset="50%" stop-color="#da77f2"/>
      <stop offset="100%" stop-color="#ae3ec9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#occultBg)"/>

  <!-- Brilho Místico do Círculo de Rituais no Solo -->
  <ellipse cx="300" cy="310" rx="190" ry="75" fill="url(#arcaneRuneGlow)"/>

  <!-- Paredes de Pedra e Janela Ogival com Céu Noturno Estrelado -->
  <path d="M 230 180 L 230 70 Q 300 10 370 70 L 370 180 Z" fill="#040206" stroke="#4a148c" stroke-width="3"/>
  <!-- Lua Nova e Constelação Oculta na Janela -->
  <circle cx="320" cy="75" r="16" fill="#f8f9fa" opacity="0.85"/>
  <circle cx="328" cy="72" r="14" fill="#040206"/>
  <!-- Grades Ogivais da Janela -->
  <line x1="300" y1="20" x2="300" y2="180" stroke="#4a148c" stroke-width="1.5"/>
  <line x1="230" y1="110" x2="370" y2="110" stroke="#4a148c" stroke-width="1.5"/>

  <!-- Estantes de Grimórios Proibidos (Esquerda e Direita) -->
  <!-- Estante Esquerda -->
  <rect x="30" y="50" width="130" height="290" fill="#140a12" stroke="#381b30" stroke-width="3"/>
  <line x1="30" y1="120" x2="160" y2="120" stroke="#4a2240" stroke-width="3"/>
  <line x1="30" y1="190" x2="160" y2="190" stroke="#4a2240" stroke-width="3"/>
  <line x1="30" y1="260" x2="160" y2="260" stroke="#4a2240" stroke-width="3"/>
  <!-- Livros e Frascos na Estante Esquerda -->
  <rect x="45" y="70" width="16" height="48" fill="#880e4f"/>
  <rect x="63" y="65" width="20" height="53" fill="#4a148c"/>
  <rect x="85" y="75" width="15" height="43" fill="#311b92"/>
  <rect x="102" y="62" width="22" height="56" fill="#1a237e"/>
  <rect x="45" y="140" width="18" height="48" fill="#b71c1c"/>
  <rect x="65" y="145" width="15" height="43" fill="#0d47a1"/>
  <circle cx="125" cy="165" r="14" fill="#2e7d32" opacity="0.8" stroke="#81c784"/>
  <!-- Crânio Iluminado na Estante -->
  <circle cx="120" cy="95" r="10" fill="#e0e0e0"/>
  <ellipse cx="120" cy="103" rx="7" ry="5" fill="#e0e0e0"/>
  <circle cx="117" cy="96" r="2" fill="#000000"/>
  <circle cx="123" cy="96" r="2" fill="#000000"/>

  <!-- Mesa Alquímica à Direita -->
  <polygon points="430,220 570,220 585,340 415,340" fill="#180e14" stroke="#3b202c" stroke-width="3"/>
  <!-- Frascos, Retorta Alquímica e Tubos de Ensaio -->
  <path d="M 460 215 L 460 195 L 470 195 L 470 215 L 485 240 L 445 240 Z" fill="#e91e63" opacity="0.85" stroke="#f48fb1"/>
  <ellipse cx="465" cy="235" rx="16" ry="6" fill="#ad1457"/>
  <!-- Alambique com Vapor Espectral -->
  <path d="M 490 220 Q 520 180 540 210 Q 555 230 535 240 Z" fill="#9c27b0" opacity="0.75" stroke="#ce93d8"/>
  <path d="M 520 180 Q 510 150 530 130" stroke="#e1bee7" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- O Círculo Ritualístico Rúnico no Chão (Perspectiva Oblíqua) -->
  <ellipse cx="300" cy="320" rx="160" ry="55" fill="none" stroke="url(#magicRune)" stroke-width="3"/>
  <ellipse cx="300" cy="320" rx="140" ry="48" fill="none" stroke="url(#magicRune)" stroke-width="1.5" stroke-dasharray="8,6"/>
  <ellipse cx="300" cy="320" rx="90" ry="32" fill="none" stroke="url(#magicRune)" stroke-width="2"/>

  <!-- Estrela de Invocação / Geometria Oculta -->
  <path d="M 300 270 L 380 345 L 200 310 L 400 310 L 220 345 Z" fill="none" stroke="url(#magicRune)" stroke-width="2"/>

  <!-- Runas Místicas Orbitando o Círculo -->
  <text x="300" y="260" font-family="'Cinzel', serif" font-size="12" fill="#f3d9fa" text-anchor="middle">ᚱ</text>
  <text x="440" y="325" font-family="'Cinzel', serif" font-size="12" fill="#f3d9fa" text-anchor="middle">ᛉ</text>
  <text x="160" y="325" font-family="'Cinzel', serif" font-size="12" fill="#f3d9fa" text-anchor="middle">ᚦ</text>
  <text x="360" y="365" font-family="'Cinzel', serif" font-size="12" fill="#f3d9fa" text-anchor="middle">ᚨ</text>
  <text x="240" y="365" font-family="'Cinzel', serif" font-size="12" fill="#f3d9fa" text-anchor="middle">ᛏ</text>

  <!-- Castiçais Góticos com Três Velas Gotejantes -->
  <!-- Esquerda -->
  <polygon points="190,300 200,300 205,335 185,335" fill="#cda34f"/>
  <line x1="195" y1="300" x2="195" y2="280" stroke="#f5f5f5" stroke-width="4"/>
  <path d="M 195 280 Q 192 268 195 264 Q 198 268 195 280" fill="#ffd54f"/>
  <!-- Direita -->
  <polygon points="400,300 410,300 415,335 395,335" fill="#cda34f"/>
  <line x1="405" y1="300" x2="405" y2="280" stroke="#f5f5f5" stroke-width="4"/>
  <path d="M 405 280 Q 402 268 405 264 Q 408 268 405 280" fill="#ffd54f"/>
</svg>
